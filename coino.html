<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Game Jual Beli</title>
  <link rel="stylesheet" href="css/coino2.css">
</head>

<body>
  <div class="numpang">
    <img src="img/Logo.png" alt="Logo" class="logo">
    <h1 class="judul">COINO</h1>
  </div>



  <div class="price-box" id="priceBox"></div>

  <div class="question" id="question"></div>

  <div class="answer">
    <div class="slot" data-slot="tens"></div>
    <div class="slot" data-slot="ones"></div>
  </div>

  <div class="choices" id="choices"></div>

  <p><span id="round">1</span> / 3</p>

  <div class="message" id="message"></div>
  
  <script src="js/coino2.js"></script>
</body>

</html>
